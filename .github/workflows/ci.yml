name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache model checkpoints
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: torch-checkpoints-${{ hashFiles('ghostframe.py', 'ghostframe_png/backbones.py') }}
      - name: Install (hashed lock, the same one the demo container uses)
        run: |
          python -m pip install --require-hashes --no-deps -r server/requirements.lock \
            --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Published fixtures decode
        run: python -m bench.verify_fixtures

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:worker
