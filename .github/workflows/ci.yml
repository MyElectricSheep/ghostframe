name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache model checkpoints
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: torch-checkpoints-${{ hashFiles('ghostframe.py', 'ghostframe_png/backbones.py') }}
      - name: Install
        run: |
          python -m pip install 'torch==2.7.1+cpu' 'torchvision==0.22.1+cpu' \
            --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install -e '.[tiled,server]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Published fixtures decode
        run: python -m bench.verify_fixtures

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
