[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostframe"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["torch==2.7.1", "torchvision==0.22.1", "numpy==2.3.5", "Pillow==12.3.0", "scikit-image==0.25.2"]

[project.optional-dependencies]
tiled = ["cryptography==50.0.2", "reedsolo==1.7.0"]
learned = ["trustmark==0.9.2"]
perceptual = ["lpips==0.1.4"]

[project.scripts]
ghostframe = "ghostframe:main"
ghostframe-png = "ghostframe_png.cli:main"

[tool.setuptools]
py-modules = ["ghostframe"]
packages = ["ghostframe_png"]

[tool.setuptools.package-data]
ghostframe_png = ["data/*.npy"]
